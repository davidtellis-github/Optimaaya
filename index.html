<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Optimaaya — Digital Marketing, Refined</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static copy of the React enquiry form so Netlify Forms detects it at deploy time. -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="subject" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <select name="support"></select>
      <textarea name="message"></textarea>
      <input name="budget" />
      <input name="timeline" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
